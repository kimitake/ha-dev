services:
  python-dev:
    build:
      context: .
      dockerfile: dev/Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        DEV_USERNAME: ${DEV_USERNAME:-developer}
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src/dryer-sensor/python/src
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - ./data:/data
      - platformio-data:/home/${DEV_USERNAME:-developer}/.platformio
      - vscode-server:/home/${DEV_USERNAME:-developer}/.vscode-server
    stdin_open: true
    tty: true

volumes:
  platformio-data:
  vscode-server:
